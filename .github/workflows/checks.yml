name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Слои кэшируются между запусками: пересборка окружения идёт только при
      # изменении pyproject.toml или uv.lock, а не при каждой правке кода.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          tags: kinase-ifp-potential:base
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Через compose, а не `docker run`: у сервиса `dev` репозиторий примонтирован
      # в /workspace, и проверки идут по рабочему дереву — той же командой, что
      # локально.
      #
      # `docker run` без монтирования проверял бы слепок, вшитый в образ командой
      # `COPY . .`, а из слепка `.dockerignore` вырезает `.git`, `data` и `runs`:
      # проверки шли бы не по тому дереву, которое лежит в репозитории.
      - name: ruff
        run: docker compose run --rm dev ruff check .

      - name: mypy
        run: docker compose run --rm dev mypy src

      - name: pytest
        run: docker compose run --rm dev pytest -q
