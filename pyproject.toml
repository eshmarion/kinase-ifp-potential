[project]
name = "kinase-ifp-potential"
version = "0.1.0"
description = "Потенциал на основе IFP для диффузионной модели DiffSBDD (лиганды киназ)"
readme = "README.md"
# Python строго 3.10, границы совпадают намеренно: разные версии дают разные наборы
# колёс и разное поведение библиотек, а смысл контейнера в том, чтобы этого не было.
# На 3.12 сборка opencadd падает вовсе: его versioneer зовёт configparser.SafeConfigParser,
# удалённый в 3.12. На 3.11 opencadd собирается, но 3.10 выбрана как версия с самой
# широкой поддержкой со стороны химических библиотек (rdkit, prolif, MDAnalysis).
requires-python = ">=3.10,<3.11"

# Базовый набор: всё, что нужно для расчёта IFP и метрик локально на Windows без GPU.
# Тяжёлый torch сюда осознанно не входит — см. optional-dependencies.
dependencies = [
    "rdkit>=2023.9",
    "prolif>=2.0",
    # opencadd на PyPI отсутствует, ставится из GitHub и закреплён коммитом.
    # Его setup.py не объявляет зависимостей (они есть только в conda-рецепте),
    # поэтому bravado, biopandas и tqdm перечислены здесь явно.
    "opencadd @ git+https://github.com/volkamerlab/opencadd@57eafc2d4bd1970742773fbd40764fc47dc480e0",
    "bravado>=11.0",
    "biopandas>=0.5",
    "tqdm>=4.66",
    "mdanalysis>=2.7",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    # Рисунки. Раньше приходил транзитивно с prolif или posebusters:
    # работало, но сломалось бы при первом обновлении той библиотеки, и связь
    # с обновлением по сообщению об ошибке видна бы не была.
    "matplotlib>=3.8",
    # Тест окружения читает pyproject.toml, чтобы сверить установленное с объявленным.
    # В stdlib разбор TOML появился только в 3.11 (`tomllib`), а проект на 3.10.
    # В образе tomli лежит транзитивно — объявлен явно ровно по уроку строки выше.
    "tomli>=2.0",
    # Колёс под Windows у vina нет вовсе: PyPI отдаёт manylinux, musllinux и sdist,
    # а сборка из исходников требует Boost, SWIG и компилятора. Без маркера нативный
    # `uv sync` на Windows уходил бы собирать Vina и падал, закрывая запасной путь
    # для машины, где не встал Docker. В образе
    # и в CI платформа Linux, поэтому там ставится как обычно; тесты докинга
    # на Windows пропускаются сами — `tests/test_docking.py` сделан на importorskip.
    "vina>=1.2.7; sys_platform != 'win32'",
    "meeko>=0.8.0",
]

[project.optional-dependencies]
# Дифференцируемый потенциал. Отдельно, чтобы расчёт IFP не тянул ~2 ГБ torch.
potential = [
    "torch>=2.0",
]
# Запуск в облаке: клиент Modal нужен только тому, кто отправляет задачи на GPU.
cloud = [
    "modal>=1.0",
]
# Контрольные метрики физичности поз (docs/metrics.md, раздел 3.6).
metrics = [
    "posebusters>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.3.3.260113",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# opencadd подключён прямой ссылкой на git — hatchling требует это явно разрешить.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/kinase_ifp", "src/soft_potential", "src/integration",
    "src/experiments", "src/evaluation",
]

# torch берётся с CPU-индекса PyTorch, а не с PyPI. Под Linux (а образ контейнера —
# Linux) пакет torch с PyPI тянет за собой сборку с CUDA и ~2,5 ГБ пакетов nvidia-*,
# которые здесь не нужны: расчёт идёт на CPU, а генерация — в Modal со своим образом.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
# Внешние библиотеки без аннотаций типов: проверять их бессмысленно, а править чужой
# код нельзя — правка не переживёт переустановку пакета.
[[tool.mypy.overrides]]
module = [
    "rdkit.*", "prolif.*", "opencadd.*", "MDAnalysis.*", "posebusters.*",
    "sklearn.*", "biopandas.*", "bravado.*", "modal.*", "torch_scatter.*", "openbabel.*",
    "vina.*", "meeko.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
